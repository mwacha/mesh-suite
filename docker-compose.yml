services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      # Host port 5433 (not the default 5432) to avoid colliding with other
      # local projects' Postgres instances. Container-internal port stays
      # 5432 — the backend service below talks to it over the docker network
      # via that internal port, unaffected by this host-side remap.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./mesh-suite-backend
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      # The app connects as the non-superuser role from Step 13, never as
      # DB_ADMIN_USER (which is a cluster superuser and would bypass RLS).
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      # Host port 8081 (not the default 8080), matching application.yml's
      # SERVER_PORT default -- avoids colliding with other local projects'
      # backends.
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./mesh-suite-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8081/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
