<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PediMais — Wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>* { box-sizing: border-box; margin: 0; padding: 0; }</style>

<template id="__bundler_thumbnail" data-bg-color="#f1f5f9">
  <svg viewBox="0 0 160 100" xmlns="http://www.w3.org/2000/svg">
    <!-- sidebar -->
    <rect x="0" y="0" width="30" height="100" fill="#1e293b"/>
    <rect x="5" y="12" width="20" height="4" rx="2" fill="#475569"/>
    <rect x="5" y="22" width="20" height="4" rx="2" fill="#475569"/>
    <rect x="5" y="32" width="20" height="4" rx="2" fill="#2563eb"/>
    <rect x="5" y="42" width="20" height="4" rx="2" fill="#475569"/>
    <rect x="5" y="52" width="20" height="4" rx="2" fill="#475569"/>
    <!-- content area -->
    <rect x="34" y="8" width="120" height="12" rx="2" fill="#e2e8f0"/>
    <rect x="34" y="26" width="55" height="30" rx="3" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="38" y="30" width="30" height="3" rx="1" fill="#94a3b8"/>
    <rect x="38" y="36" width="44" height="10" rx="2" fill="#eff6ff"/>
    <rect x="96" y="26" width="55" height="30" rx="3" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="100" y="30" width="30" height="3" rx="1" fill="#94a3b8"/>
    <rect x="100" y="36" width="44" height="10" rx="2" fill="#dcfce7"/>
    <rect x="34" y="64" width="117" height="28" rx="3" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="38" y="68" width="50" height="3" rx="1" fill="#94a3b8"/>
    <rect x="38" y="74" width="80" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="38" y="80" width="60" height="3" rx="1" fill="#e2e8f0"/>
    <!-- logo -->
    <rect x="4" y="2" width="22" height="7" rx="2" fill="#2563eb"/>
    <rect x="6" y="3.5" width="18" height="4" rx="1" fill="#fff" opacity="0.3"/>
  </svg>
</template>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
// ── TOKENS ──────────────────────────────────────────────────────────────────
const WF = { fontFamily: "'Inter', system-ui, sans-serif" };
const C = {
  dark: '#1e293b', mid: '#475569', muted: '#94a3b8', border: '#374151',
  borderLight: '#e2e8f0', bg: '#f1f5f9', white: '#fff',
  blue: '#2563eb', blueBg: '#eff6ff', blueText: '#1d4ed8',
  green: '#15803d', greenBg: '#dcfce7',
  orange: '#d97706', orangeBg: '#fef3c7',
  red: '#dc2626', redBg: '#fee2e2',
};

// ── PRIMITIVES ──────────────────────────────────────────────────────────────
const Box = ({ w, h, label, style = {} }) => (
  <div style={{ width: w, height: h, background: '#e2e8f0', border: '2px dashed #94a3b8', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#94a3b8', fontSize: 13, flexShrink: 0, ...WF, ...style }}>
    {label || '[ imagem ]'}
  </div>
);

let __setRoute = () => {};
let CURRENT_ROUTE = 'login';
const go = (r) => { if (r) __setRoute(r); if (typeof window !== 'undefined') window.scrollTo(0, 0); };
const NAV_ROUTE = { Home: 'dashboard', Pedidos: 'pedidosList', Produtos: 'produtosList', Clientes: 'clientesList', Marcas: 'marcasList', 'Tab. Preços': 'tabprecoList', Pagamentos: 'pagamentos', 'Usuários': 'usuariosList', 'Permissões': 'permissoes', Empresa: 'empresaList' };
const EDIT_OF = { produtosList: 'produtosNew', clientesList: 'clientesNew', marcasList: 'marcasNew', tabprecoList: 'tabprecoNew', usuariosList: 'usuariosNew', empresaList: 'empresaNew', categoriasList: 'categoriasNew', pagamentos: 'pagamentosNew', pedidosList: 'pedidos' };
const TIPO_ROUTE = { 'Simples': 'produtosNew', 'Kit': 'produtosNewKit', 'Com Variação': 'produtosNewVariacao' };

const Card = ({ children, style = {} }) => (
  <div style={{ background: C.white, border: `2px solid ${C.borderLight}`, borderRadius: 6, ...style }}>{children}</div>
);

const WFLabel = ({ children }) => (
  <div style={{ fontSize: 12, color: C.muted, marginBottom: 3, ...WF }}>{children}</div>
);

const WFInput = ({ label, ph = '...', style = {} }) => (
  <div style={{ marginBottom: 10, ...style }}>
    {label && <WFLabel>{label}</WFLabel>}
    <div style={{ height: 32, border: `2px solid ${C.border}`, borderRadius: 4, background: C.white, padding: '0 8px', display: 'flex', alignItems: 'center', color: '#9ca3af', fontSize: 13, ...WF }}>
      {ph}
    </div>
  </div>
);

const WFSelect = ({ label, ph = '...' }) => (
  <div style={{ marginBottom: 10 }}>
    {label && <WFLabel>{label}</WFLabel>}
    <div style={{ height: 32, border: `2px solid ${C.border}`, borderRadius: 4, background: C.white, padding: '0 8px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', color: '#9ca3af', fontSize: 13, ...WF }}>
      <span>{ph}</span><span style={{ fontSize: 10 }}>▼</span>
    </div>
  </div>
);

const WFSelectOptions = ({ label, items = [], placeholder = 'Selecione...', onSelect, selected: selectedProp }) => {
  const [open, setOpen] = React.useState(false);
  const [selected, setSelected] = React.useState(selectedProp || null);
  const [dropPos, setDropPos] = React.useState({});
  const ref = React.useRef(null);
  const menuRef = React.useRef(null);
  const handleSelect = (it) => { setSelected(it); if (onSelect) onSelect(it); setOpen(false); };
  React.useEffect(() => {
    if (!open) return;
    const close = e => {
      const inTrigger = ref.current && ref.current.contains(e.target);
      const inMenu = menuRef.current && menuRef.current.contains(e.target);
      if (!inTrigger && !inMenu) setOpen(false);
    };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);
  const handleClick = () => {
    if (ref.current) {
      const r = ref.current.getBoundingClientRect();
      const viewH = document.documentElement.clientHeight;
      setDropPos(viewH - r.bottom > items.length * 36 + 10
        ? { top: r.bottom + 2, left: r.left, width: r.width }
        : { bottom: viewH - r.top + 2, left: r.left, width: r.width }
      );
    }
    setOpen(v => !v);
  };
  const menu = open ? ReactDOM.createPortal(
    <div ref={menuRef} style={{ position: 'fixed', ...dropPos, zIndex: 9999, background: '#fff', border: '1.5px solid #e5e7eb', borderRadius: 5, boxShadow: '0 6px 20px rgba(0,0,0,0.12)', fontFamily: "'Inter',system-ui,sans-serif", overflow: 'hidden' }}>
      {items.map(it => (
        <div key={it} onClick={() => handleSelect(it)} style={{ padding: '8px 12px', fontSize: 12, color: it === selected ? C.blue : '#374151', background: it === selected ? C.blueBg : '#fff', cursor: 'pointer', borderBottom: '1px solid #f3f4f6' }}>
          {it}
        </div>
      ))}
    </div>,
    document.body
  ) : null;
  return (
    <div ref={ref} style={{ marginBottom: 10 }}>
      {label && <WFLabel>{label}</WFLabel>}
      <div onClick={handleClick} style={{ height: 32, border: `2px solid ${C.border}`, borderRadius: 4, background: C.white, padding: '0 8px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 13, ...WF, cursor: 'pointer', color: selected ? C.dark : '#9ca3af' }}>
        <span>{selected || placeholder}</span>
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none" style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s', flexShrink: 0 }}><path d="M2 4l4 4 4-4" stroke="#9ca3af" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </div>
      {menu}
    </div>
  );
};

const WFBtn = ({ label, v = 'primary', small = false, style = {}, to, onClick }) => {
  const bg = v === 'primary' ? C.blue : v === 'danger' ? C.red : C.borderLight;
  const col = v === 'secondary' ? C.dark : C.white;
  const border = v === 'secondary' ? C.muted : bg;
  return (
    <div onClick={to ? () => go(to) : onClick} style={{ background: bg, color: col, borderRadius: 4, padding: small ? '3px 10px' : '7px 16px', fontSize: small ? 12 : 13, display: 'inline-flex', alignItems: 'center', gap: 5, border: `2px solid ${border}`, cursor: 'pointer', ...WF, ...style }}>
      {label}
    </div>
  );
};

const WFBadge = ({ label, col = 'blue' }) => {
  const map = { blue: [C.blueBg, C.blueText], green: [C.greenBg, C.green], orange: [C.orangeBg, C.orange], red: [C.redBg, C.red], gray: ['#f1f5f9', C.mid] };
  const [bg, fg] = map[col] || map.blue;
  return <span style={{ background: bg, color: fg, borderRadius: 12, padding: '2px 8px', fontSize: 11, ...WF }}>{label}</span>;
};

const Pager = ({ total, unit }) => (
  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10, fontSize: 12, color: C.muted, ...WF }}>
    <span>Exibindo 1–20 de {total} {unit}</span>
    <div style={{ display: 'flex', gap: 4 }}>
      {['‹','1','2','3','...','›'].map((p, i) => (
        <div key={i} style={{ width: 26, height: 26, border: `2px solid ${p==='1'?C.blue:C.borderLight}`, borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, background: p==='1'?C.blue:C.white, color: p==='1'?C.white:C.dark }}>{p}</div>
      ))}
    </div>
  </div>
);

const Stat = ({ icon, label, value, delta }) => (
  <Card style={{ flex: 1, padding: '12px 14px' }}>
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
      <div>
        <div style={{ fontSize: 11, color: C.muted, ...WF, marginBottom: 4 }}>{label}</div>
        <div style={{ fontSize: 24, fontWeight: 700, color: C.dark, ...WF }}>{value}</div>
        {delta && <div style={{ fontSize: 11, color: C.green, ...WF }}>▲ {delta}</div>}
      </div>
      <span style={{ fontSize: 20 }}>{icon}</span>
    </div>
  </Card>
);

const Sidebar = ({ items, collapsed, onToggle }) => (
  <div style={{ width: collapsed ? 48 : 200, background: C.dark, display: 'flex', flexDirection: 'column', borderRight: `2px solid #334155`, flexShrink: 0, transition: 'width .18s' }}>
    <div style={{ padding: '12px 10px', borderBottom: '2px solid #334155', display: 'flex', alignItems: 'center', justifyContent: collapsed ? 'center' : 'space-between', minHeight: 50 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, overflow: 'hidden' }}>
        <div style={{ width: 26, height: 26, background: C.blue, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.white, fontSize: 13, fontWeight: 700, ...WF, flexShrink: 0 }}>P</div>
        {!collapsed && <span style={{ color: '#f1f5f9', fontSize: 15, fontWeight: 700, ...WF, whiteSpace: 'nowrap' }}>PediMais</span>}
      </div>
      <div
        onClick={onToggle}
        title={collapsed ? 'Expandir menu' : 'Recolher menu'}
        style={{ width: 22, height: 22, background: '#334155', borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: C.muted, fontSize: 10, flexShrink: 0, marginLeft: collapsed ? 0 : 4 }}
      >{collapsed ? '▶' : '◀'}</div>
    </div>
    <div style={{ flex: 1, padding: '6px 0' }}>
      {items.map((item, i) => (
        <div key={i} onClick={() => NAV_ROUTE[item.label] && go(NAV_ROUTE[item.label])} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 10px', background: item.active ? C.blue : 'transparent', color: item.active ? C.white : C.muted, fontSize: 12, cursor: 'pointer', borderRadius: 4, margin: '1px 5px', ...WF, justifyContent: collapsed ? 'center' : 'flex-start' }} title={collapsed ? item.label : ''}>
          <span style={{ fontSize: 15, flexShrink: 0 }}>{item.icon}</span>
          {!collapsed && <span>{item.label}</span>}
        </div>
      ))}
    </div>
    {!collapsed ? (
      <div style={{ borderTop: '2px solid #334155', padding: '8px 10px', display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ width: 26, height: 26, background: '#475569', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.white, fontSize: 12, ...WF, flexShrink: 0 }}>A</div>
        <div>
          <div style={{ color: '#f1f5f9', fontSize: 12, ...WF }}>Admin User</div>
          <div style={{ color: C.muted, fontSize: 10, ...WF }}>admin@empresa.com</div>
        </div>
      </div>
    ) : (
      <div style={{ borderTop: '2px solid #334155', padding: '8px 0', display: 'flex', justifyContent: 'center' }}>
        <div style={{ width: 26, height: 26, background: '#475569', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.white, fontSize: 12, ...WF }}>A</div>
      </div>
    )}
  </div>
);

// ── PAINEL DE NOTIFICAÇÕES ───────────────────────────────────────────────────
const NotifPanel = ({ onClose }) => {
  const notifs = [
    { icon: '📋', title: 'Novo pedido #043', desc: 'Mercado Silva — R$ 1.200', time: '2 min', unread: true },
    { icon: '⚠️', title: 'Estoque crítico', desc: 'Produto Alpha: 3 unidades restantes', time: '10 min', unread: true },
    { icon: '👥', title: 'Novo cliente cadastrado', desc: 'Farmácia Central Ltda', time: '1h', unread: true },
    { icon: '✅', title: 'Pedido #041 aprovado', desc: 'Aprovação automática pelo sistema', time: '2h', unread: false },
    { icon: '📦', title: 'Importação concluída', desc: '124 produtos atualizados com sucesso', time: '3h', unread: false },
  ];
  return (
    <div style={{ width: 360, background: C.white, border: '1.5px solid #e5e7eb', borderRadius: 8, boxShadow: '0 8px 32px rgba(0,0,0,0.14)', overflow: 'hidden', ...WF }}>
      <div style={{ padding: '13px 16px 11px', borderBottom: `1px solid ${C.borderLight}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontSize: 14, fontWeight: 700, color: C.dark }}>Notificações</span>
          <div style={{ background: C.red, borderRadius: 10, padding: '1px 7px', fontSize: 10, color: '#fff', fontWeight: 700 }}>3</div>
        </div>
        <span onClick={onClose} style={{ fontSize: 12, color: C.blue, cursor: 'pointer' }}>Marcar todas como lidas</span>
      </div>
      {notifs.map((n, i) => (
        <div key={i} onClick={onClose} style={{ padding: '11px 16px', borderBottom: i < notifs.length - 1 ? `1px solid #f8fafc` : 'none', display: 'flex', gap: 10, alignItems: 'flex-start', cursor: 'pointer', background: n.unread ? '#f8fafc' : C.white }}>
          <div style={{ width: 34, height: 34, background: n.unread ? C.blueBg : '#f1f5f9', borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, flexShrink: 0 }}>{n.icon}</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
              <span style={{ fontSize: 13, fontWeight: n.unread ? 600 : 400, color: C.dark }}>{n.title}</span>
              <span style={{ fontSize: 11, color: C.muted, flexShrink: 0 }}>{n.time}</span>
            </div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>{n.desc}</div>
          </div>
          {n.unread && <div style={{ width: 7, height: 7, borderRadius: '50%', background: C.blue, flexShrink: 0, marginTop: 6 }}></div>}
        </div>
      ))}
      <div style={{ padding: '11px 16px', borderTop: `1px solid ${C.borderLight}`, textAlign: 'center' }}>
        <span onClick={onClose} style={{ fontSize: 12, color: C.blue, cursor: 'pointer' }}>Ver todas as notificações →</span>
      </div>
    </div>
  );
};

// ── MENU DO USUÁRIO ──────────────────────────────────────────────────────────
const UserMenuPanel = ({ onClose }) => (
  <div style={{ width: 242, background: C.white, border: '1.5px solid #e5e7eb', borderRadius: 8, boxShadow: '0 8px 32px rgba(0,0,0,0.14)', overflow: 'hidden', ...WF }}>
    <div style={{ padding: '14px 16px 12px', borderBottom: `1px solid ${C.borderLight}` }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
        <div style={{ width: 38, height: 38, background: C.blue, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 15, fontWeight: 700, flexShrink: 0 }}>A</div>
        <div>
          <div style={{ fontSize: 13, fontWeight: 700, color: C.dark }}>Admin User</div>
          <div style={{ fontSize: 11, color: C.muted }}>admin@empresa.com</div>
        </div>
      </div>
      <WFBadge label="Administrador" col="blue" />
    </div>
    {[['👤','Meu Perfil'],['⚙️','Configurações'],['🏢','Alterar Empresa'],['❓','Ajuda & Suporte']].map(([ic, lb]) => (
      <div key={lb} onClick={onClose} style={{ padding: '10px 16px', fontSize: 13, color: '#374151', cursor: 'pointer', borderBottom: `1px solid #f8fafc`, display: 'flex', alignItems: 'center', gap: 10 }}>
        <span>{ic}</span>{lb}
      </div>
    ))}
    <div onClick={onClose} style={{ padding: '10px 16px', fontSize: 13, color: C.red, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10 }}>
      <span>🚪</span> Sair
    </div>
  </div>
);

// ── TOPBAR ───────────────────────────────────────────────────────────────────
const Topbar = ({ crumbs = [] }) => {
  const [notifOpen, setNotifOpen] = React.useState(false);
  const [userOpen, setUserOpen]   = React.useState(false);
  const bellRef = React.useRef(null);
  const userRef = React.useRef(null);
  const [bellPos, setBellPos] = React.useState({});
  const [userPos, setUserPos] = React.useState({});

  const openNotif = () => {
    if (bellRef.current) {
      const r = bellRef.current.getBoundingClientRect();
      setBellPos({ top: r.bottom + 6, right: window.innerWidth - r.right + 2 });
    }
    setNotifOpen(v => !v); setUserOpen(false);
  };
  const openUser = () => {
    if (userRef.current) {
      const r = userRef.current.getBoundingClientRect();
      setUserPos({ top: r.bottom + 6, right: window.innerWidth - r.right + 2 });
    }
    setUserOpen(v => !v); setNotifOpen(false);
  };

  return (
    <div style={{ height: 46, background: C.white, borderBottom: `2px solid ${C.borderLight}`, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 18px', flexShrink: 0, position: 'relative', zIndex: 10 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 5, ...WF }}>
        {crumbs.map((b, i) => (
          <React.Fragment key={i}>
            {i > 0 && <span style={{ color: C.muted, fontSize: 12 }}>/</span>}
            <span onClick={() => i===0 && go('dashboard')} style={{ color: i===crumbs.length-1 ? C.dark : C.muted, fontSize: 13, fontWeight: i===crumbs.length-1 ? 700 : 400, cursor: i===0 ? 'pointer' : 'default' }}>{b}</span>
          </React.Fragment>
        ))}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, border: `1.5px solid ${C.borderLight}`, borderRadius: 5, padding: '4px 10px', background: '#f8fafc', cursor: 'pointer' }}>
          <span style={{ fontSize: 14 }}>🏢</span>
          <span style={{ fontSize: 12, color: C.dark, fontWeight: 600, ...WF }}>Empresa Principal</span>
          <span style={{ fontSize: 9, color: C.muted }}>▼</span>
        </div>
        {/* Sino com badge */}
        <div ref={bellRef} onClick={openNotif} style={{ position: 'relative', cursor: 'pointer', padding: '2px 4px', borderRadius: 5, background: notifOpen ? C.blueBg : 'transparent' }}>
          <span style={{ fontSize: 16 }}>🔔</span>
          <div style={{ position: 'absolute', top: 0, right: 0, width: 15, height: 15, background: C.red, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, color: '#fff', fontWeight: 700, border: '1.5px solid #fff' }}>3</div>
        </div>
        {/* Avatar */}
        <div ref={userRef} onClick={openUser} style={{ width: 28, height: 28, background: userOpen ? C.blueText : C.blue, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, color: '#fff', fontWeight: 700, cursor: 'pointer', border: `2px solid ${userOpen ? '#1e40af' : 'transparent'}` }}>A</div>
      </div>
      {/* Portals */}
      {notifOpen && ReactDOM.createPortal(
        <>
          <div onClick={() => setNotifOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 9990 }} />
          <div style={{ position: 'fixed', top: bellPos.top, right: bellPos.right, zIndex: 9991 }}>
            <NotifPanel onClose={() => setNotifOpen(false)} />
          </div>
        </>, document.body
      )}
      {userOpen && ReactDOM.createPortal(
        <>
          <div onClick={() => setUserOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 9990 }} />
          <div style={{ position: 'fixed', top: userPos.top, right: userPos.right, zIndex: 9991 }}>
            <UserMenuPanel onClose={() => setUserOpen(false)} />
          </div>
        </>, document.body
      )}
    </div>
  );
};

const ActionsCell = ({ status }) => {
  const [open, setOpen] = React.useState(false);
  const [dropPos, setDropPos] = React.useState({});
  const ref = React.useRef(null);
  const isAtivo = status === 'ativo';

  React.useEffect(() => {
    if (!open) return;
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);

  const handleClick = () => {
    if (ref.current) {
      const r = ref.current.getBoundingClientRect();
      const viewH = document.documentElement.clientHeight;
      const dropH = 150;
      const spaceBelow = viewH - r.bottom;
      setDropPos(spaceBelow > dropH
        ? { top: r.bottom + 4, left: r.left }
        : { bottom: viewH - r.top + 4, left: r.left }
      );
    }
    setOpen(v => !v);
  };

  const menu = open ? ReactDOM.createPortal(
    <div style={{ position: 'fixed', ...dropPos, zIndex: 9999, background: '#fff', border: '1.5px solid #e5e7eb', borderRadius: 5, minWidth: 130, boxShadow: '0 6px 20px rgba(0,0,0,0.12)', fontFamily: "'Inter',system-ui,sans-serif" }}>
      <div onClick={() => { setOpen(false); if (EDIT_OF[CURRENT_ROUTE]) go(EDIT_OF[CURRENT_ROUTE]); }} style={{ padding: '8px 14px', fontSize: 12, color: '#374151', cursor: 'pointer', borderBottom: '1px solid #f3f4f6' }}>Editar</div>
      <div onClick={() => setOpen(false)} style={{ padding: '8px 14px', fontSize: 12, color: '#374151', cursor: 'pointer', borderBottom: '1px solid #f3f4f6' }}>{isAtivo ? 'Inativar' : 'Ativar'}</div>
      <div onClick={() => setOpen(false)} style={{ padding: '8px 14px', fontSize: 12, color: '#374151', cursor: 'pointer' }}>Deletar</div>
    </div>,
    document.body
  ) : null;

  return (
    <div ref={ref} style={{ display: 'inline-block' }}>
      <div
        onClick={handleClick}
        style={{ height: 26, border: '1.5px solid #d1d5db', borderRadius: 4, background: '#fff', padding: '0 9px', display: 'flex', alignItems: 'center', gap: 5, fontSize: 12, color: '#1e293b', cursor: 'pointer', fontFamily: "'Inter',system-ui,sans-serif", userSelect: 'none' }}
      >
        Ações
        <svg width="9" height="9" viewBox="0 0 12 12" fill="none">
          <path d="M2 4l4 4 4-4" stroke="#6b7280" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>
      {menu}
    </div>
  );
};

// Seletor com busca e paginação
const WFSelectSearch = ({ label, items = [], placeholder = 'Selecione...', style = {} }) => {
  const [open, setOpen] = React.useState(false);
  const [q, setQ] = React.useState('');
  const [page, setPage] = React.useState(0);
  const [selected, setSelected] = React.useState(null);
  const ref = React.useRef(null);
  const [dropPos, setDropPos] = React.useState({});
  const PER = 20;
  const filtered = items.filter(i => i.toLowerCase().includes(q.toLowerCase()));
  const totalPages = Math.ceil(filtered.length / PER);
  const visible = filtered.slice(page * PER, (page + 1) * PER);
  React.useEffect(() => {
    if (!open) return;
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);
  const handleOpen = () => {
    if (ref.current) {
      const r = ref.current.getBoundingClientRect();
      setDropPos({ top: r.bottom + 4, left: r.left, width: Math.max(r.width, 220) });
    }
    setOpen(v => !v); setQ(''); setPage(0);
  };
  const panel = open ? ReactDOM.createPortal(
    <div style={{ position: 'fixed', top: dropPos.top, left: dropPos.left, width: dropPos.width, zIndex: 9999, background: '#fff', border: '1.5px solid #e5e7eb', borderRadius: 6, boxShadow: '0 6px 20px rgba(0,0,0,0.12)', fontFamily: "'Inter',system-ui,sans-serif" }}>
      <div style={{ padding: '6px 8px 4px' }}>
        <input autoFocus value={q} onChange={e => { setQ(e.target.value); setPage(0); }} placeholder="Buscar..." style={{ width: '100%', border: '1.5px solid #e5e7eb', borderRadius: 4, padding: '6px 10px', fontSize: 12, outline: 'none', boxSizing: 'border-box', fontFamily: "'Inter',system-ui,sans-serif" }} />
      </div>
      <div style={{ maxHeight: 190, overflowY: 'auto' }}>
        {visible.length === 0
          ? <div style={{ padding: '10px 14px', fontSize: 12, color: '#9ca3af' }}>Nenhum resultado</div>
          : visible.map((item, i) => (
            <div key={i} onClick={() => { setSelected(item); setOpen(false); }} style={{ padding: '8px 14px', fontSize: 13, color: item === selected ? C.blue : '#374151', background: item === selected ? C.blueBg : 'transparent', cursor: 'pointer', borderBottom: '1px solid #f3f4f6', display: 'flex', alignItems: 'center', gap: 8 }}>
              {item === selected && <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 3" stroke={C.blue} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              {item}
            </div>
          ))
        }
      </div>
      {totalPages > 1 && (
        <div style={{ padding: '5px 8px', borderTop: '1px solid #f3f4f6', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div onClick={() => setPage(p => Math.max(0, p-1))} style={{ width: 24, height: 24, border: '1.5px solid #e5e7eb', borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontSize: 14, color: page === 0 ? '#d1d5db' : C.dark }}>‹</div>
          <span style={{ fontSize: 11, color: '#9ca3af', fontFamily: "'Inter',system-ui,sans-serif" }}>{page * PER + 1}–{Math.min((page+1)*PER, filtered.length)} de {filtered.length}</span>
          <div onClick={() => setPage(p => Math.min(totalPages-1, p+1))} style={{ width: 24, height: 24, border: '1.5px solid #e5e7eb', borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontSize: 14, color: page >= totalPages-1 ? '#d1d5db' : C.dark }}>›</div>
        </div>
      )}
    </div>,
    document.body
  ) : null;
  return (
    <div style={{ marginBottom: 10, ...style }} ref={ref}>
      {label && <div style={{ fontSize: 12, color: C.muted, marginBottom: 3, ...WF }}>{label}</div>}
      <div onClick={handleOpen} style={{ height: 32, border: `2px solid ${open ? C.blue : C.border}`, borderRadius: 4, background: C.white, padding: '0 8px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', color: selected ? C.dark : '#9ca3af', fontSize: 13, cursor: 'pointer', ...WF }}>
        <span>{selected || placeholder}</span>
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none" style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform .15s', flexShrink: 0 }}><path d="M2 4l4 4 4-4" stroke="#6b7280" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </div>
      {panel}
    </div>
  );
};

// ── ADVANCED FILTERS (novo padrão) ───────────────────────────────────────────
const AdvancedFilters = ({ placeholder = 'Pesquisar', categories: catProp, valueMap: vmProp }) => {
  // step: null | 'menu' | 'values'
  const [step, setStep] = React.useState(null);
  const [activeFilter, setActiveFilter] = React.useState(null);
  const [pending, setPending] = React.useState([]);   // checkboxes em seleção
  const [applied, setApplied] = React.useState({});   // { filterName: [values] }
  const [q, setQ] = React.useState('');

  const BRANDS_PER_PAGE = 5;
  const [brandPage, setBrandPage] = React.useState(0);

  const categories = catProp || ['Status', 'Tipo', 'Marca'];

  const valueMap = vmProp || {
    'Status': ['Ativo','Inativo'],
    'Tipo':   ['Simples','Kit','Variação'],
    'Marca':  ['Marca Alpha','Marca Beta','Marca Gamma','Marca Delta','Marca Epsilon','Marca Zeta','Marca Eta','Marca Theta','Marca Iota','Marca Kappa','Marca Lambda','Marca Mu'],
  };

  const chips = Object.entries(applied).filter(([, v]) => v.length > 0);

  const close = () => { setStep(null); setActiveFilter(null); setQ(''); setPending([]); };

  const openMenu = () => step === 'menu' ? close() : (() => { setStep('menu'); setActiveFilter(null); })();

  const selectCategory = cat => {
    setActiveFilter(cat);
    setBrandPage(0);
    setPending(applied[cat] ? [...applied[cat]] : []);
    setStep('values');
    setQ('');
  };

  const toggle = val => setPending(prev => prev.includes(val) ? prev.filter(v => v !== val) : [...prev, val]);

  const apply = () => {
    if (pending.length > 0) {
      setApplied(prev => ({ ...prev, [activeFilter]: pending }));
    } else {
      setApplied(prev => { const n = { ...prev }; delete n[activeFilter]; return n; });
    }
    close();
  };

  const removeChip = key => { setApplied(prev => { const n = { ...prev }; delete n[key]; return n; }); };

  const allVals = (valueMap[activeFilter] || []).filter(v => v.toLowerCase().includes(q.toLowerCase()));
  const isBrand = activeFilter === 'Marca';
  const brandTotalPages = Math.ceil(allVals.length / BRANDS_PER_PAGE);
  const vals = isBrand ? allVals.slice(brandPage * BRANDS_PER_PAGE, (brandPage + 1) * BRANDS_PER_PAGE) : allVals;
  const isOpen = step !== null;

  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 12, color: C.dark, fontWeight: 500, marginBottom: 5, ...WF }}>Pesquisar</div>

      {/* Barra principal */}
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>

        {/* Input de busca */}
        <div style={{ display: 'flex', alignItems: 'stretch', border: `1.5px solid #d1d5db`, borderRadius: 5, background: C.white, height: 36, flex: 1, maxWidth: 360, overflow: 'hidden' }}>
          <span style={{ flex: 1, display: 'flex', alignItems: 'center', padding: '0 12px', fontSize: 13, color: '#9ca3af', ...WF }}>{placeholder}</span>
          <div style={{ width: 38, borderLeft: `1.5px solid #d1d5db`, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', background: '#f9fafb', flexShrink: 0 }}>
            <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
              <circle cx="9" cy="9" r="5.5" stroke="#6b7280" strokeWidth="1.8"/>
              <path d="M14 14l3 3" stroke="#6b7280" strokeWidth="1.8" strokeLinecap="round"/>
            </svg>
          </div>
        </div>

        {/* Botão Mais filtros — azul quando aberto — wrapper relativo para alinhar dropdown */}
        <div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
        <div
          onClick={openMenu}
          style={{ height: 36, border: `1.5px solid ${isOpen ? C.blue : '#d1d5db'}`, borderRadius: 5, background: isOpen ? C.blue : C.white, padding: '0 14px', display: 'flex', alignItems: 'center', gap: 7, fontSize: 13, color: isOpen ? C.white : C.dark, cursor: 'pointer', ...WF, userSelect: 'none', whiteSpace: 'nowrap' }}
        >
          Mais filtros
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" style={{ transform: isOpen ? 'rotate(180deg)' : 'none', transition: 'transform .15s' }}>
            <path d="M2 4l4 4 4-4" stroke={isOpen ? 'white' : '#6b7280'} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>

        {/* Passo 1 — menu de categorias */}
        {step === 'menu' && (
          <div style={{ position: 'absolute', top: 42, left: 'auto', right: 0, zIndex: 40, background: C.white, border: `1.5px solid #e5e7eb`, borderRadius: 6, minWidth: 220, boxShadow: '0 8px 28px rgba(0,0,0,0.10)' }}>
            {categories.map((cat, i) => (
              <div
                key={i}
                onClick={() => selectCategory(cat)}
                style={{ padding: '11px 18px', fontSize: 13, color: '#374151', cursor: 'pointer', borderBottom: i < categories.length - 1 ? `1px solid #f3f4f6` : 'none', ...WF }}
              >
                {cat}
              </div>
            ))}
          </div>
        )}

        {/* Passo 2 — lista de valores com checkbox OU UI especial */}
        {step === 'values' && activeFilter === 'Faixa de preços' && (
          <div style={{ position: 'absolute', top: 42, right: 0, zIndex: 40, background: C.white, border: `1.5px solid #e5e7eb`, borderRadius: 6, width: 340, boxShadow: '0 8px 28px rgba(0,0,0,0.10)', padding: 16 }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', gap: 8, alignItems: 'end', marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 12, color: C.muted, marginBottom: 5, ...WF }}>Valor inicial <span style={{ color: C.red }}>*</span></div>
                <div style={{ display: 'flex', border: `1.5px solid ${C.border}`, borderRadius: 4, overflow: 'hidden', height: 36 }}>
                  <div style={{ padding: '0 8px', background: '#f1f5f9', borderRight: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', fontSize: 12, color: C.mid, ...WF }}>R$</div>
                  <div style={{ flex: 1, display: 'flex', alignItems: 'center', padding: '0 8px', fontSize: 13, color: '#9ca3af', ...WF }}>0,00</div>
                </div>
              </div>
              <div style={{ fontSize: 13, color: C.mid, ...WF, paddingBottom: 8 }}>até</div>
              <div>
                <div style={{ fontSize: 12, color: C.muted, marginBottom: 5, ...WF }}>Valor final <span style={{ color: C.red }}>*</span></div>
                <div style={{ display: 'flex', border: `1.5px solid ${C.border}`, borderRadius: 4, overflow: 'hidden', height: 36 }}>
                  <div style={{ padding: '0 8px', background: '#f1f5f9', borderRight: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', fontSize: 12, color: C.mid, ...WF }}>R$</div>
                  <div style={{ flex: 1, display: 'flex', alignItems: 'center', padding: '0 8px', fontSize: 13, color: '#9ca3af', ...WF }}>0,00</div>
                </div>
              </div>
            </div>
            <div style={{ borderTop: `1px solid #e5e7eb`, paddingTop: 12, display: 'flex', gap: 8, justifyContent: 'space-between' }}>
              <div onClick={close} style={{ flex: 1, height: 36, border: `1.5px solid ${C.border}`, borderRadius: 5, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 600, color: C.dark, cursor: 'pointer', ...WF }}>Cancelar</div>
              <div onClick={apply} style={{ flex: 1, height: 36, background: C.blue, borderRadius: 5, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 600, color: '#fff', cursor: 'pointer', ...WF }}>Aplicar filtro</div>
            </div>
          </div>
        )}

        {step === 'values' && activeFilter !== 'Faixa de preços' && (
          <div style={{ position: 'absolute', top: 42, right: 0, zIndex: 40, background: C.white, border: `1.5px solid #e5e7eb`, borderRadius: 6, width: 300, boxShadow: '0 8px 28px rgba(0,0,0,0.10)' }}>
            <div style={{ padding: '8px 8px 4px' }}>
              <input
                autoFocus
                value={q}
                onChange={e => setQ(e.target.value)}
                style={{ width: '100%', border: `1.5px solid #e5e7eb`, borderRadius: 4, padding: '7px 10px', fontSize: 13, outline: 'none', ...WF, color: C.dark, boxSizing: 'border-box' }}
              />
            </div>
            <div style={{ maxHeight: 200, overflowY: 'auto' }}>
              {vals.map((val, i) => {
                const checked = pending.includes(val);
                return (
                  <div key={i} onClick={() => toggle(val)} style={{ padding: '10px 14px', fontSize: 13, color: '#374151', cursor: 'pointer', borderBottom: `1px solid #f3f4f6`, display: 'flex', alignItems: 'center', gap: 10, ...WF }}>
                    <div style={{ width: 16, height: 16, border: `1.5px solid ${checked ? C.blue : '#d1d5db'}`, borderRadius: 3, background: checked ? C.blue : C.white, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, transition: 'background .1s' }}>
                      {checked && <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5l2.5 2.5L8 3" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                    </div>
                    {val}
                  </div>
                );
              })}
            </div>
            <div style={{ padding: '6px 10px', borderTop: '1px solid #e5e7eb', borderBottom: '1px solid #e5e7eb', display: 'flex', alignItems: 'center', justifyContent: 'space-between', minHeight: 36 }}>
              {isBrand && brandTotalPages > 1 ? (
                <>
                  <div onClick={() => setBrandPage(p => Math.max(0, p - 1))} style={{ width: 26, height: 26, borderRadius: 4, border: `1.5px solid ${C.borderLight}`, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontSize: 13, color: brandPage === 0 ? C.muted : C.dark }}>‹</div>
                  <span style={{ fontSize: 11, color: C.muted, ...WF }}>{brandPage * BRANDS_PER_PAGE + 1}–{Math.min((brandPage + 1) * BRANDS_PER_PAGE, allVals.length)} de {allVals.length} marcas</span>
                  <div onClick={() => setBrandPage(p => Math.min(brandTotalPages - 1, p + 1))} style={{ width: 26, height: 26, borderRadius: 4, border: `1.5px solid ${C.borderLight}`, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontSize: 13, color: brandPage >= brandTotalPages - 1 ? C.muted : C.dark }}>›</div>
                </>
              ) : null}
            </div>
            <div style={{ padding: '8px' }}>
              <div onClick={apply} style={{ background: C.blue, color: C.white, borderRadius: 5, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 600, cursor: 'pointer', ...WF }}>
                Aplicar
              </div>
            </div>
          </div>
        )}
        </div>
      </div>

      {/* Chips de filtros aplicados */}
      {chips.length > 0 && (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontSize: 12, color: '#6b7280', fontWeight: 500, marginBottom: 7, ...WF }}>Mais filtros selecionados</div>
          <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 6 }}>
            {chips.map(([key, vals], i) => (
              <div key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, border: `1.5px solid #d1d5db`, borderRadius: 20, padding: '4px 12px', fontSize: 12, color: '#374151', background: C.white, ...WF }}>
                <span><strong style={{ fontWeight: 500 }}>{key}:</strong> {vals.join(', ')}</span>
                <span onClick={() => removeChip(key)} style={{ color: '#9ca3af', cursor: 'pointer', fontSize: 16, lineHeight: 1, marginLeft: 3 }}>×</span>

// Gráfico de linha SVG (wireframe)
const WFLineChart = ({ color = '#2563eb' }) => {
  const data = [5,8,12,15,10,14,18,22,16,20,25,28,22,18,24,30,35,28,32,38,30,26,32,36,28,34,38,42,36,38];
  const W = 700, H = 90;
  const pad = { t: 10, r: 12, b: 22, l: 28 };
  const iW = W - pad.l - pad.r;
  const iH = H - pad.t - pad.b;
  const max = Math.max(...data);
  const xS = i => pad.l + (i / (data.length - 1)) * iW;
  const yS = v => pad.t + iH - (v / max) * iH;
  const pts = data.map((v, i) => [xS(i), yS(v)]);
  const line = pts.map(([x,y], i) => `${i===0?'M':'L'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
  const area = `${line} L${xS(data.length-1).toFixed(1)} ${(pad.t+iH).toFixed(1)} L${xS(0).toFixed(1)} ${(pad.t+iH).toFixed(1)}Z`;
  const yTicks = [0, Math.round(max*0.5), max];
  const xLabels = [1,6,11,16,21,26,30];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 105 }}>
      {/* Grid horizontais */}
      {yTicks.map((v,i) => (
        <line key={i} x1={pad.l} x2={W-pad.r} y1={yS(v)} y2={yS(v)} stroke="#e2e8f0" strokeWidth="1" strokeDasharray="4 3" />
      ))}
      {/* Área preenchida */}
      <path d={area} fill={color} fillOpacity="0.07" />
      {/* Linha */}
      <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      {/* Pontos a cada 5 dias */}
      {pts.filter((_,i) => i%5===0 || i===data.length-1).map(([x,y],i) => (
        <circle key={i} cx={x} cy={y} r="3.5" fill="#fff" stroke={color} strokeWidth="2" />
      ))}
      {/* Labels eixo X */}
      {xLabels.map(d => (
        <text key={d} x={xS(d-1)} y={H-4} textAnchor="middle" fontSize="9" fill="#94a3b8" fontFamily="Inter,sans-serif">{d}</text>
      ))}
      {/* Labels eixo Y */}
      {yTicks.map((v,i) => (
        <text key={i} x={pad.l-4} y={yS(v)+3.5} textAnchor="end" fontSize="9" fill="#94a3b8" fontFamily="Inter,sans-serif">{v}</text>
      ))}
    </svg>
  );
};

// Banner azul de ações em lote
const BulkActionsBar = ({ count, open, setOpen }) => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);

  return (
    <div style={{
      background: C.blue,
      padding: '9px 14px',
      display: 'flex', alignItems: 'center', gap: 12,
      borderBottom: `2px solid ${C.blueText}`,
    }}>
      <span style={{ fontSize: 13, color: C.white, fontWeight: 500, ...WF }}>
        {count} registro(s) selecionado(s)
      </span>
      <div ref={ref} style={{ position: 'relative' }}>
        <div
          onClick={() => setOpen(v => !v)}
          style={{
            height: 30, border: `1.5px solid rgba(255,255,255,0.45)`,
            borderRadius: 4, background: 'rgba(255,255,255,0.18)',
            padding: '0 12px', display: 'flex', alignItems: 'center', gap: 6,
            fontSize: 13, color: C.white, cursor: 'pointer', ...WF,
            fontWeight: 600, userSelect: 'none',
          }}
        >
          Ações em lote
          <svg width="9" height="9" viewBox="0 0 12 12" fill="none" style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform .15s' }}>
            <path d="M2 4l4 4 4-4" stroke="white" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
        {open && (
          <div style={{
            position: 'absolute', top: 36, left: 0, zIndex: 9999,
            background: C.white, border: '1.5px solid #e5e7eb',
            borderRadius: 5, minWidth: 180,
            boxShadow: '0 6px 20px rgba(0,0,0,0.12)', ...WF,
          }}>
            <div onClick={() => setOpen(false)} style={{ padding: '9px 14px', fontSize: 13, color: '#374151', cursor: 'pointer', borderBottom: '1px solid #f3f4f6', display: 'flex', alignItems: 'center', gap: 8 }}>

              <span>📤</span> Exportar selecionados

              <span>🗑</span> Excluir selecionados
            </div>
          </div>
        )}
      </div>
      {/* Deselecionar tudo */}
      <span

const ClienteActionsCell = ({ status }) => {
  const [open, setOpen] = React.useState(false);
  const [dropPos, setDropPos] = React.useState({});
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);
  const handleClick = () => {
    if (ref.current) {
      const r = ref.current.getBoundingClientRect();
      const viewH = document.documentElement.clientHeight;
      const spaceBelow = viewH - r.bottom;
      setDropPos(spaceBelow > 140
        ? { top: r.bottom + 4, left: r.left }
        : { bottom: viewH - r.top + 4, left: r.left }
      );
    }
    setOpen(v => !v);
  };
  const menu = open ? ReactDOM.createPortal(
    <div style={{ position: 'fixed', ...dropPos, zIndex: 9999, background: '#fff', border: '1.5px solid #e5e7eb', borderRadius: 5, minWidth: 140, boxShadow: '0 6px 20px rgba(0,0,0,0.12)', fontFamily: "'Inter',system-ui,sans-serif" }}>

      <div onClick={() => setOpen(false)} style={{ padding: '8px 14px', fontSize: 12, color: '#374151', cursor: 'pointer', borderBottom: '1px solid #f3f4f6' }}>
        {status === 'bloqueado' ? 'Ativar' : 'Bloquear'}
      </div>
      <div onClick={() => setOpen(false)} style={{ padding: '8px 14px', fontSize: 12, color: C.red, cursor: 'pointer' }}>Excluir</div>
    </div>,
    document.body
  ) : null;
  return (
    <div ref={ref} style={{ display: 'inline-block' }}>
      <div onClick={handleClick} style={{ height: 26, border: '1.5px solid #d1d5db', borderRadius: 4, background: '#fff', padding: '0 9px', display: 'flex', alignItems: 'center', gap: 5, fontSize: 12, color: '#1e293b', cursor: 'pointer', fontFamily: "'Inter',system-ui,sans-serif", userSelect: 'none' }}>

      {menu}
    </div>
  );
};

              {pageVals.length === 0 && <div style={{ padding: '8px 12px', fontSize: 12, color: '#9ca3af' }}>Nenhuma opção</div>}
              {pageVals.map(v => (
                <div key={v} onClick={() => setPending(p => p.includes(v) ? p.filter(x => x !== v) : [...p, v])} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 12px', fontSize: 12, color: C.dark, cursor: 'pointer', ...WF }}>
                  <div style={{ width: 15, height: 15, borderRadius: 3, border: `1.5px solid ${pending.includes(v) ? C.blue : '#cbd5e1'}`, background: pending.includes(v) ? C.blue : C.white, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                    {pending.includes(v) && <svg width="9" height="9" viewBox="0 0 10 10"><path d="M2 5l2.5 2.5L8 3" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  </div>
                  {v}
                </div>
              ))}
            </div>
            {fvals.length > PER && (
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '5px 10px', borderTop: '1px solid #f3f4f6' }}>
                <div onClick={() => setValPage(p => Math.max(0, p - 1))} style={{ width: 22, height: 22, border: `1.5px solid ${cur === 0 ? '#e5e7eb' : '#d1d5db'}`, borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, color: cur === 0 ? C.muted : C.dark, cursor: cur === 0 ? 'default' : 'pointer' }}>‹</div>
                <span style={{ fontSize: 11, color: C.muted, ...WF }}>{cur + 1} / {pages}</span>
                <div onClick={() => setValPage(p => Math.min(pages - 1, p + 1))} style={{ width: 22, height: 22, border: `1.5px solid ${cur === pages - 1 ? '#e5e7eb' : '#d1d5db'}`, borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, color: cur === pages - 1 ? C.muted : C.dark, cursor: cur === pages - 1 ? 'default' : 'pointer' }}>›</div>
              </div>
            )}
            <div style={{ display: 'flex', gap: 8, padding: '8px 10px', borderTop: '1px solid #f3f4f6' }}>
              <div onClick={() => setPending([])} style={{ flex: 1, textAlign: 'center', padding: '5px 0', fontSize: 12, color: C.muted, cursor: 'pointer', ...WF }}>Limpar</div>
              <div onClick={applyCat} style={{ flex: 1, textAlign: 'center', padding: '5px 0', fontSize: 12, fontWeight: 600, color: '#fff', background: C.blue, borderRadius: 4, cursor: 'pointer', ...WF }}>Aplicar</div>
            </div>
          </div>
        ); })()}
      </div>
      <div style={{ maxHeight: 260, overflowY: 'auto' }}>
        {list.length === 0 && <div style={{ padding: '10px 14px', fontSize: 12, color: '#9ca3af' }}>Nenhum resultado</div>}
        {list.map((p) => (
          <div key={p.sku} onClick={() => pick(`${p.sku} · ${p.nome}`)} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', borderBottom: '1px solid #f3f4f6', cursor: 'pointer', background: selected === `${p.sku} · ${p.nome}` ? C.blueBg : '#fff', ...WF }}>
            <span style={{ fontSize: 11, color: C.muted, fontFamily: 'monospace', width: 78, flexShrink: 0 }}>{p.sku}</span>
            <span style={{ fontSize: 13, color: C.dark, flex: 1, ...WF }}>{p.nome}</span>
            <WFBadge label={p.tipo} col={TIPO_COL[p.tipo]} />
            <span style={{ fontSize: 12, color: C.mid, ...WF, width: 82, textAlign: 'right' }}>{p.preco}</span>
          </div>
        ))}
      </div>
    </div>,
    document.body
  ) : null;

  return (
    <div style={{ margin: 0 }} ref={ref}>
      {label && <div style={{ fontSize: 12, color: C.muted, marginBottom: 3, ...WF }}>{label}</div>}
      <div onClick={handleOpen} style={{ height: 32, border: `2px solid ${open ? C.blue : C.border}`, borderRadius: 4, background: C.white, padding: '0 8px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', color: selected ? C.dark : '#9ca3af', fontSize: 13, cursor: 'pointer', ...WF }}>

      </div>
      {panel}
    </div>
  );
};
